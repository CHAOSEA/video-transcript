[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript-workbench"
version = "0.3.0"
description = "Subtitle-first online video transcription with local CPU ASR fallback."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["faster-whisper==1.2.1", "av==17.0.0", "yt-dlp[default]==2026.7.4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
video-transcript = "video_transcript_workbench.cli:main"
video-transcript-online = "video_transcript_workbench.online_cli:main"
video-transcript-link = "video_transcript_workbench.link_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/video-transcript-workbench" = [
  "DEPENDENCIES.md",
  "docs/online-support-matrix.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
